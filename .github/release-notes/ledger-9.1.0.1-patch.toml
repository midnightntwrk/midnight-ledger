# Consumer patch table for the embargoed 9.1.0.1 release. Add it to a crate
# that depends on crates.io `midnight-ledger` 8.x alongside `midnight-ledger-v9`.
#
# `midnight-transient-crypto` 2.2.0, `midnight-zkir` 2.2.0 and
# `midnight-base-crypto-derive` 1.1.0 come from crates.io and must not be
# patched: the former `transient-crypto-2.2.0` tag lacked the 8.1.2 verifier-key
# hardening, and ledger-8 resolves to the same 2.x copy.
[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "base-crypto-1.1.1" }
midnight-ledger-v9 = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "crate-ledger-9.1.0.1" }
midnight-ledger-static = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "crate-ledger-9.1.0.1" }
midnight-zswap = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "zswap-9.0.1" }
midnight-coin-structure = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "coin-structure-3.0.1" }
midnight-transient-crypto = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "transient-crypto-3.0.1" }
midnight-onchain-state = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "onchain-state-4.0.1" }
midnight-onchain-vm = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "onchain-vm-4.0.1" }
midnight-onchain-runtime = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "crate-onchain-runtime-4.0.1" }
midnight-serialize = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "serialize-1.2.1" }
midnight-storage = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "storage-3.0.0" }
midnight-storage-core = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "storage-core-1.2.3" }
midnight-storage-macros = { git = "https://github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "storage-macros-1.0.1" }
