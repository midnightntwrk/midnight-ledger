name: Prepare cost model docker image

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MIDNIGHTBOT_PACKAGES_WRITE:
        required: true
      GH_USERNAME:
        required: true
      GH_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GH_PASSWORD }} api.github.com=${{ secrets.GH_PASSWORD }}
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: stable # Or 'nightly', 'beta', or a specific version like '1.70.0'
          override: true
          profile: minimal # Installs rustc, cargo, and rust-std. Use 'default' for rustfmt, clippy, etc.

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Create and push cost model docker image
        run: |
          nix develop . --command generate-cost-model/build-docker.sh
          docker push ghcr.io/midnight-ntwrk/generate-ledger-cost-model:latest

