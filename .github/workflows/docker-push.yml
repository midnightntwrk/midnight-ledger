name: Docker Build multiplatform image and push to registry

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MIDNIGHTBOT_PACKAGES_WRITE:
        required: true
      GH_USERNAME:
        required: true
      GH_PASSWORD:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SIGNING_SERVICE_ACCOUNT:
        required: true
      PROOF_SERVER_SIGNING_KEY_PASSPHRASE:
        required: true

jobs:
  docker-amd64:
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Setup api.github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: api.github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Setup github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Configure git rewrite
        run: |
          mkdir -p $HOME/.config/git
          echo '[url "https://github.com/"]' >> $HOME/.config/git/config
          echo '  insteadOf = "git@github.com:"' >> $HOME/.config/git/config
          echo '  insteadOf = "git@github.com/"' >> $HOME/.config/git/config
          echo '  insteadOf = "ssh://git@github.com/"' >> $HOME/.config/git/config

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Create proof-server images
        run: |
          PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
          git pull
          nix build -L .#proof-server-oci
          docker load -i result
          docker push ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-amd64

  docker-arm64:
    runs-on: ubuntu-latest-4-core-arm64
    needs: docker-amd64

    steps:
      - name: Setup api.github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: api.github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Setup github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Build and push arm64 image
        run: |
          PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
          nix build -L .#proof-server-oci-arm64
          docker load -i result
          docker push ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-arm64

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup api.github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: api.github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Setup github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Create and push manifest
        run: |
          PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
          echo "PROOF_SERVER_VERSION=$PROOF_SERVER_VERSION" >> $GITHUB_ENV

          docker manifest create ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION \
            ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-amd64 \
            ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-arm64

          docker manifest push ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION

          # Only a final release moves `latest`; a pre-release version contains a
          # '-' (e.g. 8.2.0-rc.1). ($VERSION was undefined here, so `latest` was
          # always pushed - guard on the actual proof-server version instead.)
          if [[ "$PROOF_SERVER_VERSION" != *"-"* ]]; then
            docker manifest create ghcr.io/midnight-ntwrk/proof-server:latest \
              ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-amd64 \
              ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-arm64
            docker manifest push ghcr.io/midnight-ntwrk/proof-server:latest
          fi

          IMAGE_DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION \
            --format '{{.Manifest.Digest}}')
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SIGNING_SERVICE_ACCOUNT }}

      - name: Fetch signing key from Secret Manager
        id: fetch-key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SIGNING_KEY:projects/mnf-federated-node-operator/secrets/midnight-proof-server-signing-key/versions/latest

      - name: Sign proof-server build manifest
        env:
          SIGNING_KEY: ${{ steps.fetch-key.outputs.SIGNING_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.PROOF_SERVER_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          export GNUPGHOME=$(mktemp -d)

          # CI runners have no TTY, so gpg-agent can't launch an interactive
          # pinentry to collect the key passphrase (it would fail with
          # "Inappropriate ioctl for device"). Configure loopback pinentry so
          # the passphrase is fed directly on stdin instead. Written before the
          # first gpg call so the agent picks it up on launch.
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"

          # Runs on every exit path (success or failure) so the imported
          # signing key never outlives this step. Batch-mode secret-key
          # deletion requires the full fingerprint, not the key ID.
          cleanup() {
            if [[ -n "${KEY_FPR:-}" ]]; then
              gpg --batch --yes --delete-secret-keys "$KEY_FPR" || true
            fi
            rm -rf "$GNUPGHOME"
          }
          trap cleanup EXIT

          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ {print $5; exit}')
          KEY_FPR=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print $10; exit}')

          cat > build-manifest.json <<EOF
          {
            "version": "${PROOF_SERVER_VERSION}",
            "image": "ghcr.io/midnight-ntwrk/proof-server:${PROOF_SERVER_VERSION}",
            "image_digest": "${IMAGE_DIGEST}",
            "git_commit": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "workflow_run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "signed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # --passphrase-fd 0 reads the passphrase from stdin (not argv, which
          # would leak it via the process list); loopback keeps gpg from
          # prompting.
          printf '%s' "$SIGNING_KEY_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --armor --local-user "$KEY_ID" \
                --detach-sign --output build-manifest.json.asc build-manifest.json

          gpg --verify build-manifest.json.asc build-manifest.json

      - name: Upload signed build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-server-build-manifest-${{ env.PROOF_SERVER_VERSION }}
          path: |
            build-manifest.json
            build-manifest.json.asc
            proof-server/midnight-proof-server-public.asc
          if-no-files-found: error
