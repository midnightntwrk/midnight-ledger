name: Docker Build multiplatform image and push to registry

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-push images and re-sign the manifest even when this proof-server version is already published."
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_MIDNIGHTNTWRK_USER:
        required: true
      DOCKERHUB_MIDNIGHTNTWRK_TOKEN:
        required: true
      MIDNIGHTBOT_PACKAGES_WRITE:
        required: true
      GH_USERNAME:
        required: true
      GH_PASSWORD:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SIGNING_SERVICE_ACCOUNT:
        required: true
      PROOF_SERVER_SIGNING_KEY_PASSPHRASE:
        required: true

jobs:
  docker-amd64:
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Docker login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Configure git rewrite
        run: |
          mkdir -p $HOME/.config/git
          echo '[url "https://github.com/"]' >> $HOME/.config/git/config
          echo '  insteadOf = "git@github.com:"' >> $HOME/.config/git/config
          echo '  insteadOf = "git@github.com/"' >> $HOME/.config/git/config
          echo '  insteadOf = "ssh://git@github.com/"' >> $HOME/.config/git/config

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Create proof-server images
        env:
          FORCE: ${{ inputs.force }}
        run: |
          PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
          GHCR_IMAGE="ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-amd64"
          HUB_IMAGE="docker.io/midnightntwrk/proof-server:$PROOF_SERVER_VERSION-amd64"
          # A published version is immutable: re-pushing would change the digest
          # under an already signed manifest.
          if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$GHCR_IMAGE" >/dev/null 2>&1; then
            echo "$GHCR_IMAGE already exists - skipping build and push."
            exit 0
          fi
          nix build -L .#proof-server-oci
          docker load -i result
          docker push "$GHCR_IMAGE"

          docker tag "$GHCR_IMAGE" "$HUB_IMAGE"
          docker push "$HUB_IMAGE"

      # Disabled as we currently have no experimental features
      #- name: Create experimental proof-server images
      #  run: |
      #    PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
      #    nix build -L .#proof-server-oci-experimental 
      #    docker load -i result
      #    docker push ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-amd64_experimental

      #    docker tag ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-amd64_experimental \
      #      docker.io/midnightntwrk/proof-server:$PROOF_SERVER_VERSION-amd64_experimental
      #    docker push docker.io/midnightntwrk/proof-server:$PROOF_SERVER_VERSION-amd64_experimental

  docker-arm64:
    runs-on: ubuntu-latest-4-core-arm64

    steps:
      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Docker login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Build and push arm64 image
        env:
          FORCE: ${{ inputs.force }}
        run: |
          PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
          GHCR_IMAGE="ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-arm64"
          HUB_IMAGE="docker.io/midnightntwrk/proof-server:$PROOF_SERVER_VERSION-arm64"
          if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$GHCR_IMAGE" >/dev/null 2>&1; then
            echo "$GHCR_IMAGE already exists - skipping build and push."
            exit 0
          fi
          nix build -L .#proof-server-oci-arm64
          docker load -i result
          docker push "$GHCR_IMAGE"

          docker tag "$GHCR_IMAGE" "$HUB_IMAGE"
          docker push "$HUB_IMAGE"

      # Disabled as we currently have no experimental features
      #- name: Create experimental proof-server images
      #  run: |
      #    PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
      #    nix build -L .#proof-server-oci-arm64-experimental 
      #    docker load -i result
      #    docker push ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-arm64_experimental

      #    docker tag ghcr.io/midnight-ntwrk/proof-server:$PROOF_SERVER_VERSION-arm64_experimental \
      #      docker.io/midnightntwrk/proof-server:$PROOF_SERVER_VERSION-arm64_experimental
      #    docker push docker.io/midnightntwrk/proof-server:$PROOF_SERVER_VERSION-arm64_experimental

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Docker login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Checkout ledger repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Create and push manifest
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROOF_SERVER_VERSION=$(nix eval --raw .#proof-server-version)
          echo "PROOF_SERVER_VERSION=$PROOF_SERVER_VERSION" >> $GITHUB_ENV
          GHCR="ghcr.io/midnight-ntwrk/proof-server"
          HUB="docker.io/midnightntwrk/proof-server"
          V="$PROOF_SERVER_VERSION"

          # The proof-server release is complete once its GitHub release carries
          # the signed manifest; the signing steps are skipped then unless forced.
          PUBLISH_MANIFEST=true
          if [ "${FORCE:-false}" != "true" ] \
             && gh release view "proof-server-${V}" --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -qx 'build-manifest.json.asc'; then
            echo "proof-server-${V} is already released with a signed manifest - nothing to do."
            PUBLISH_MANIFEST=false
          fi
          echo "PUBLISH_MANIFEST=$PUBLISH_MANIFEST" >> $GITHUB_ENV

          for REPO in "$GHCR" "$HUB"; do
            # Skipping an existing version also keeps a re-run of an old release
            # from moving `latest` backwards.
            if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$REPO:$V" >/dev/null 2>&1; then
              echo "$REPO:$V already exists - keeping the published manifest list."
              continue
            fi
            # Every release, pre-release included, needs a version tag that
            # resolves per-architecture, or users must pin -amd64/-arm64 by hand.
            docker manifest create "$REPO:$V" "$REPO:$V-amd64" "$REPO:$V-arm64"
            docker manifest push "$REPO:$V"

            # Only a final release moves `latest`; a pre-release version contains a '-'.
            if [[ "$V" != *"-"* ]]; then
              docker manifest create "$REPO:latest" "$REPO:$V-amd64" "$REPO:$V-arm64"
              docker manifest push "$REPO:latest"
            fi
          done

          IMAGE_DIGEST=$(docker buildx imagetools inspect "$GHCR:$V" --format '{{.Manifest.Digest}}')
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: Authenticate to GCP (Workload Identity Federation)
        if: env.PUBLISH_MANIFEST == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SIGNING_SERVICE_ACCOUNT }}

      - name: Fetch signing key from Secret Manager
        if: env.PUBLISH_MANIFEST == 'true'
        id: fetch-key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SIGNING_KEY:projects/mnf-federated-node-operator/secrets/midnight-proof-server-signing-key/versions/latest

      - name: Sign proof-server build manifest
        if: env.PUBLISH_MANIFEST == 'true'
        env:
          SIGNING_KEY: ${{ steps.fetch-key.outputs.SIGNING_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.PROOF_SERVER_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          export GNUPGHOME=$(mktemp -d)

          # CI runners have no TTY, so gpg-agent can't launch an interactive
          # pinentry to collect the key passphrase (it would fail with
          # "Inappropriate ioctl for device"). Configure loopback pinentry so
          # the passphrase is fed directly on stdin instead. Written before the
          # first gpg call so the agent picks it up on launch.
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"

          # Runs on every exit path (success or failure) so the imported
          # signing key never outlives this step. Batch-mode secret-key
          # deletion requires the full fingerprint, not the key ID.
          cleanup() {
            if [[ -n "${KEY_FPR:-}" ]]; then
              gpg --batch --yes --delete-secret-keys "$KEY_FPR" || true
            fi
            rm -rf "$GNUPGHOME"
          }
          trap cleanup EXIT

          # upload-artifact roots the artifact at the least common ancestor of
          # its matched files, so a key left under proof-server/ would keep that
          # prefix and land outside the flat path the release job uploads from.
          cp proof-server/midnight-proof-server-public.asc .

          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ {print $5; exit}')
          KEY_FPR=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print $10; exit}')

          cat > build-manifest.json <<EOF
          {
            "version": "${PROOF_SERVER_VERSION}",
            "image": "ghcr.io/midnight-ntwrk/proof-server:${PROOF_SERVER_VERSION}",
            "image_digest": "${IMAGE_DIGEST}",
            "git_commit": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "workflow_run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "signed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # --passphrase-fd 0 reads the passphrase from stdin (not argv, which
          # would leak it via the process list); loopback keeps gpg from
          # prompting.
          printf '%s' "$SIGNING_KEY_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --armor --local-user "$KEY_ID" \
                --detach-sign --output build-manifest.json.asc build-manifest.json

          gpg --verify build-manifest.json.asc build-manifest.json

      - name: Upload signed build manifest
        if: env.PUBLISH_MANIFEST == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-server-build-manifest-${{ env.PROOF_SERVER_VERSION }}
          path: |
            build-manifest.json
            build-manifest.json.asc
            midnight-proof-server-public.asc
          if-no-files-found: error

      # The proof server is released on its own tag so its signed manifest does
      # not depend on a Ledger release existing.
      - name: Publish proof-server GitHub release
        if: env.PUBLISH_MANIFEST == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="proof-server-${PROOF_SERVER_VERSION}"
          ASSETS="build-manifest.json build-manifest.json.asc midnight-proof-server-public.asc"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - refreshing manifest assets."
            gh release upload "$TAG" $ASSETS --clobber
            exit 0
          fi
          PRERELEASE_FLAG=""
          if [[ "$PROOF_SERVER_VERSION" == *"-"* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          NOTES=$(printf 'Image: `ghcr.io/midnight-ntwrk/proof-server:%s` (also `docker.io/midnightntwrk/proof-server:%s`)\nDigest: `%s`\n\nVerify the build manifest with the attached public key:\n\n```\ngpg --import midnight-proof-server-public.asc\ngpg --verify build-manifest.json.asc build-manifest.json\n```\n' \
            "$PROOF_SERVER_VERSION" "$PROOF_SERVER_VERSION" "$IMAGE_DIGEST")
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Proof Server ${PROOF_SERVER_VERSION}" \
            --notes "$NOTES" $PRERELEASE_FLAG $ASSETS
