name: Ledger Test Coverage

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - 'ledger-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  coverage:
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-Cinstrument-coverage'
      LLVM_PROFILE_FILE: 'cargo-test-%p-%m.profraw'
    runs-on: ubuntu-latest-8-core-x64
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            # crates.io 403s any User-Agent starting with "curl/", which is what
            # nixpkgs' fetchurl sends. Flake-local overlays cannot reach nixpkgs
            # instantiated inside other flakes (the pinned zkir input), so override
            # the agent for every fixed-output builder here. curl rejects
            # --user-agent=X, and impure-env values cannot contain spaces, hence -A.
            # The feature list is spelled out in full: install-nix-action skips its
            # own "experimental-features = nix-command flakes" default whenever this
            # block merely contains that substring (install-nix.sh:60).
            experimental-features = nix-command flakes configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-Amidnight-ledger/1.0
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore reusable Nix outputs
        uses: ./.github/actions/cache-nix
        with:
          workload: ${{ github.workflow }}-${{ github.job }}

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache instrumented Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: coverage-${{ hashFiles('flake.lock') }}

      - name: Download grcov
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sL https://github.com/mozilla/grcov/releases/download/v0.10.5/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C "${HOME}/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check test coverage
        run: |
          nix develop -c cargo test --workspace --all-features --verbose -- --nocapture --test-threads=1

      - name: Generate HTML report
        run: |
          nix develop .#ci -c rustup component add llvm-tools-preview
          RUSTFLAGS='' nix develop .#ci -c cargo install cargo-binutils
          grcov . --binary-path ./target/debug/deps/ -s . -t html --ignore-not-existing --ignore '../*' --ignore "/*" --ignore "*tests*" -o target/coverage/html
          grcov . --binary-path ./target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../*' --ignore "/*" --ignore "*tests*" -o target/coverage/tests.lcov

      - name: Upload test report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: Coverage Report
          path: target/coverage/html

      - name: Upload lcov test report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: Lcov Coverage Report
          path: target/coverage/tests.lcov

      - name: Save reusable Nix outputs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-nix
