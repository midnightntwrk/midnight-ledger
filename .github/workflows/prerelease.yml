  release:
    needs: [ build, coverage, integration, unit-tests, benchmark ]
    # Gated on build + the test suites; benchmark result is intentionally ignored.
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.coverage.result == 'success'
          && needs.integration.result == 'success'
          && needs['unit-tests'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.build.outputs.tag_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded-artifacts

      - name: Assemble release assets and checksums
        id: assets
        run: |
          set -euo pipefail
          STAGING="release-assets"
          mkdir -p "$STAGING"
          # nullglob so absent artifacts (e.g. a failed benchmark) skip cleanly.
          shopt -s nullglob

          for f in downloaded-artifacts/npm-packages/*.tgz; do cp "$f" "$STAGING/"; done
          for f in downloaded-artifacts/unit-test-results/test-results.*; do cp "$f" "$STAGING/"; done
          for f in downloaded-artifacts/ledger-wasm-test-results-ctrf-ubuntu-latest/*; do cp "$f" "$STAGING/integration-ctrf-report.json"; done
          for f in downloaded-artifacts/ledger-wasm-test-results-junit-ubuntu-latest/*; do cp "$f" "$STAGING/integration-junit.xml"; done
          for f in downloaded-artifacts/integration-coverage-txt/*; do cp "$f" "$STAGING/integration-coverage.txt"; done

          if [ -d downloaded-artifacts/"Lcov Coverage Report" ]; then
            for f in downloaded-artifacts/"Lcov Coverage Report"/*; do cp "$f" "$STAGING/coverage.lcov"; done
          fi
          if [ -d downloaded-artifacts/"Coverage Report" ]; then
            ( cd downloaded-artifacts/"Coverage Report" && zip -qr "${GITHUB_WORKSPACE}/${STAGING}/coverage-html-report.zip" . )
          fi

          for f in downloaded-artifacts/benchmark-report-output/*; do cp "$f" "$STAGING/benchmark-output.txt"; done
          if [ -d downloaded-artifacts/benchmark-report ]; then
            ( cd downloaded-artifacts/benchmark-report && zip -qr "${GITHUB_WORKSPACE}/${STAGING}/benchmark-html-report.zip" . )
          fi

          # Guard: `sha256sum *` would block on stdin if STAGING were empty.
          if [ -n "$(ls -A "$STAGING")" ]; then
            ( cd "$STAGING" && sha256sum * > SHA256SUMS )
          else
            echo "::warning::No release assets were assembled."
          fi
          echo "Assembled release assets:"
          ls -lah "$STAGING"
          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: warn

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.assets.outputs.staging }}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] would create/update release ${TAG_NAME} (title: Ledger ${VERSION}) with assets:"
            ls -1 "${STAGING}"
            exit 0
          fi
          NOTES_FILE="${GITHUB_WORKSPACE}/.github/release-notes/${TAG_NAME}.md"

          PRERELEASE_FLAG=""
          case "${VERSION}" in
            *-rc*|*-alpha*|*-beta*|*-performance*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists - refreshing assets."
            gh release upload "${TAG_NAME}" "${STAGING}"/* --clobber
          elif [ -f "${NOTES_FILE}" ]; then
            gh release create "${TAG_NAME}" --title "Ledger ${VERSION}" \
              --notes-file "${NOTES_FILE}" ${PRERELEASE_FLAG} "${STAGING}"/*
          else
            echo "::warning::No release notes at .github/release-notes/${TAG_NAME}.md - creating release with auto-generated notes. Add the file before release to use curated notes."
            gh release create "${TAG_NAME}" --title "Ledger ${VERSION}" \
              --generate-notes ${PRERELEASE_FLAG} "${STAGING}"/*
          fi

      - name: Announce release on Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_TOPIC_LEDGER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] would announce Ledger ${VERSION} on Slack (topic-ledger)."
            exit 0
          fi
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_TOPIC_LEDGER_WEBHOOK_URL not set - skipping Slack announcement."
