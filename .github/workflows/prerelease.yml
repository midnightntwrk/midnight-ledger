name: Publish Ledger Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a rebuild even when the version is already published on both registries. npm publishing itself lives in publish.yml (idempotent; existing versions are skipped)."
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build, test and assemble artifacts (always builds, even for already-published versions) but skip every irreversible action (npm publish, docs/tag push, GitHub Release, Slack, Docker push)."
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  DRY_RUN: ${{ github.event.inputs.dry_run }}

jobs:
  build:
    runs-on: ubuntu-latest-8-core-x64
    # Real publishes require approval from a reviewer on the protected `release`
    # environment (configure its required reviewers = ledger maintainers in repo
    # Settings -> Environments). Dry runs need no approval. The build job is the
    # gate because npm publish + tag push happen here, before anything downstream.
    # NB: the truthy value must be the && arm - '' is falsy in GitHub
    # expressions, so `cond && '' || x` yields x on BOTH branches.
    environment: ${{ github.event.inputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.ids.outputs.tag_name }}
      version: ${{ steps.ids.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cargo

      - name: Configure Cargo
        run: .github/scripts/configure-cargo.sh

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: '@midnightntwrk'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Get project versions
        run: |
          for project in ledger-wasm ledger onchain-runtime-wasm onchain-runtime zkir zkir-wasm coin-structure base-crypto serialize storage transient-crypto; do
            cd "$project"
            VERSION=$( (grep '^version =' Cargo.toml || grep '^package.version =' ../Cargo.toml) | awk -F '"' '{print $2}')
            echo "$project version: $VERSION"
            VAR_NAME=$(echo "${project^^}_VERSION" | tr '-' '_')
            echo "$VAR_NAME=$VERSION" >> "$GITHUB_ENV"
            cd ..
            done

      - name: Compute release identifiers
        id: ids
        run: |
          # Display version starts with the epoch (flake.nix): ledger-8 carries it
          # in the crate version (8.1.0); ledger-9+ decouples it, so prepend
          # (epoch 9 + 1.0.0-rc.3 -> 9.1.0.0-rc.3). Matches the git tag.
          SHORT_VERSION=$(awk -F'"' '/packages\.ledger-wasm =/{for(i=1;i<=NF;i++) if($i ~ /^ledger-v[0-9]+$/){sub(/^ledger-v/,"",$i); print $i; exit}}' flake.nix)
          if [ -z "$SHORT_VERSION" ]; then echo "::error::could not derive ledger package epoch from flake.nix"; exit 1; fi
          case "$LEDGER_WASM_VERSION" in
            ${SHORT_VERSION}.*) DISPLAY_VERSION="$LEDGER_WASM_VERSION" ;;
            *)                  DISPLAY_VERSION="${SHORT_VERSION}.${LEDGER_WASM_VERSION}" ;;
          esac
          echo "version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=ledger-${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and Publish Ledger
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          # Use wasm version, as this will include pre-release tags
          VERSION="${LEDGER_WASM_VERSION}"
          SHORT_VERSION=$(awk -F'"' '/packages\.ledger-wasm =/{for(i=1;i<=NF;i++) if($i ~ /^ledger-v[0-9]+$/){sub(/^ledger-v/,"",$i); print $i; exit}}' flake.nix)
          if [ -z "$SHORT_VERSION" ]; then echo "::error::could not derive ledger package epoch from flake.nix"; exit 1; fi
          # Tag always starts with the epoch: ledger-8 carries it in the version
          # (8.1.0 -> ledger-8.1.0); ledger-9+ decouples it (9 + 1.0.0-rc.3 ->
          # ledger-9.1.0.0-rc.3).
          case "$VERSION" in
            ${SHORT_VERSION}.*) TAG_NAME="ledger-${VERSION}" ;;
            *)                  TAG_NAME="ledger-${SHORT_VERSION}.${VERSION}" ;;
          esac
          PKG="@midnight-ntwrk/ledger-v${SHORT_VERSION}"
          SCOPE="${PKG%%/*}"
          GH_REG="https://npm.pkg.github.com/midnightntwrk"
          NPMJS_REG="https://registry.npmjs.org/"

          # Build unless the version already exists on both registries (FORCE or
          # dry run always builds). The --<scope>:registry override is required:
          # npm resolves scoped packages via .npmrc and ignores --registry.
          if [ "${FORCE:-false}" != "true" ] \
             && [ "${DRY_RUN:-false}" != "true" ] \
             && npm view "$PKG@$VERSION" version --registry="$GH_REG"    "--${SCOPE}:registry=$GH_REG"    >/dev/null 2>&1 \
             && npm view "$PKG@$VERSION" version --registry="$NPMJS_REG" "--${SCOPE}:registry=$NPMJS_REG" >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published to GH Packages and npmjs - skipping build/publish."
          else
            # Docs are regenerated + reviewed in the Prepare PR, not here.
            nix build .#ledger-wasm
            cd result/lib
            echo "Contents of result/lib:"
            ls -lah
            TGZ="midnight-ledger-v${SHORT_VERSION}-${{ env.LEDGER_WASM_VERSION }}.tgz"
            # Copy out before the next nix build overwrites result/lib.
            mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
            cp "$TGZ" "${GITHUB_WORKSPACE}/release-artifacts/"
            # npm publishing happens in publish.yml, dispatched below.
            cd ../..
          fi

          # Create and push the new tag only if it does not already exist.
          if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for ledger."
          else
            git tag "${TAG_NAME}"
            "${GITHUB_WORKSPACE}/.github/scripts/run-unless-dry.sh" git push origin "${TAG_NAME}"
          fi


      - name: Build and Publish Onchain Runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          # Use wasm version, as this will include pre-release tags
          VERSION="${ONCHAIN_RUNTIME_WASM_VERSION}"
          SHORT_VERSION=$(echo "$VERSION" | awk -F. '{print $1}')
          TAG_NAME="onchain-runtime-${VERSION}"
          PKG="@midnight-ntwrk/onchain-runtime-v${SHORT_VERSION}"
          SCOPE="${PKG%%/*}"
          GH_REG="https://npm.pkg.github.com/midnightntwrk"
          NPMJS_REG="https://registry.npmjs.org/"

          # Build unless the version already exists on both registries (FORCE or
          # dry run always builds). The --<scope>:registry override is required:
          # npm resolves scoped packages via .npmrc and ignores --registry.
          if [ "${FORCE:-false}" != "true" ] \
             && [ "${DRY_RUN:-false}" != "true" ] \
             && npm view "$PKG@$VERSION" version --registry="$GH_REG"    "--${SCOPE}:registry=$GH_REG"    >/dev/null 2>&1 \
             && npm view "$PKG@$VERSION" version --registry="$NPMJS_REG" "--${SCOPE}:registry=$NPMJS_REG" >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published to GH Packages and npmjs - skipping build/publish."
          else
            # Docs are regenerated + reviewed in the Prepare PR, not here.
            nix build .#onchain-runtime-wasm
            cd result/lib
            echo "Contents of result/lib:"
            ls -lah
            TGZ="midnight-onchain-runtime-v${SHORT_VERSION}-${{ env.ONCHAIN_RUNTIME_WASM_VERSION }}.tgz"
            mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
            cp "$TGZ" "${GITHUB_WORKSPACE}/release-artifacts/"
            # npm publishing happens in publish.yml, dispatched below.
            cd ../..
          fi

          # Create and push the new tag only if it does not already exist.
          if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for onchain runtime."
          else
            git tag "${TAG_NAME}"
            "${GITHUB_WORKSPACE}/.github/scripts/run-unless-dry.sh" git push origin "${TAG_NAME}"
          fi


      - name: Build and Publish ZKIR
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          # ZKIR's git tag tracks the zkir crate version, but the published npm
          # package uses the zkir-wasm version - check existence against the wasm version.
          VERSION="${ZKIR_VERSION}"
          TAG_NAME="zkir-${VERSION}"
          WASM_VERSION="${ZKIR_WASM_VERSION}"
          SHORT_VERSION=$(echo "$WASM_VERSION" | awk -F. '{print $1}')
          PKG="@midnight-ntwrk/zkir-v${SHORT_VERSION}"
          SCOPE="${PKG%%/*}"
          GH_REG="https://npm.pkg.github.com/midnightntwrk"
          NPMJS_REG="https://registry.npmjs.org/"

          # Build unless the version already exists on both registries (FORCE or
          # dry run always builds). The --<scope>:registry override is required:
          # npm resolves scoped packages via .npmrc and ignores --registry.
          if [ "${FORCE:-false}" != "true" ] \
             && [ "${DRY_RUN:-false}" != "true" ] \
             && npm view "$PKG@$WASM_VERSION" version --registry="$GH_REG"    "--${SCOPE}:registry=$GH_REG"    >/dev/null 2>&1 \
             && npm view "$PKG@$WASM_VERSION" version --registry="$NPMJS_REG" "--${SCOPE}:registry=$NPMJS_REG" >/dev/null 2>&1; then
            echo "$PKG@$WASM_VERSION already published to GH Packages and npmjs - skipping build/publish."
          else
            # Docs are regenerated + reviewed in the Prepare PR, not here.
            nix build .#zkir-wasm
            cd result/lib
            echo "Contents of result/lib:"
            ls -lah
            TGZ="midnight-zkir-v${SHORT_VERSION}-${{ env.ZKIR_WASM_VERSION }}.tgz"
            mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
            cp "$TGZ" "${GITHUB_WORKSPACE}/release-artifacts/"
            # npm publishing happens in publish.yml, dispatched below.
            cd ../..
          fi

          # Create and push the new tag only if it does not already exist.
          if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for zkir."
          else
            git tag "${TAG_NAME}"
            "${GITHUB_WORKSPACE}/.github/scripts/run-unless-dry.sh" git push origin "${TAG_NAME}"
          fi

      - name: Upload npm package tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: npm-packages
          path: release-artifacts/*.tgz
          if-no-files-found: warn


  docker-push:
    needs: build
    if: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-push.yml
    secrets:
      MIDNIGHTBOT_PACKAGES_WRITE: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNING_SERVICE_ACCOUNT: ${{ secrets.GCP_SIGNING_SERVICE_ACCOUNT }}
      PROOF_SERVER_SIGNING_KEY_PASSPHRASE: ${{ secrets.PROOF_SERVER_SIGNING_KEY_PASSPHRASE }}

  # No `secrets:` - neither reusable workflow consumes any (GITHUB_TOKEN is
  # always provided), so passing them would violate least privilege.
  coverage:
    needs: build
    uses: ./.github/workflows/test-coverage.yml

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Run integration tests
        uses: ./.github/actions/integration-tests

  unit-tests:
    needs: build
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build and Test (default features)
        run: |
          # pipefail so a test failure (not tee's exit) fails the job.
          set -o pipefail
          cargo install cargo2junit
          nix develop .#ci -c cargo test --release -- -Z unstable-options --format json --report-time --nocapture --test-threads=1 | tee test-results.json
          # Filter is a workaround for johnterickson/cargo2junit#85
          jq -cR 'fromjson? | select( .type != "report" )' test-results.json | cargo2junit > ./test-results.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results.json
            test-results.xml

  # npm publishing lives in publish.yml (the npm trusted-publisher workflow;
  # its top-level filename is what npmjs validates, so it cannot be a
  # reusable workflow here). Dispatch it pinned to this run's commit and
  # propagate its conclusion so the release cannot complete with missing
  # npm packages.
  publish-npm:
    needs: [ build, coverage, integration, unit-tests ]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch publish.yml and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          MARK=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Correlation marker: publish.yml echoes it into its run-name, so we
          # find OUR run exactly. A timestamp filter alone races with concurrent
          # dispatches (manual or another release) and could watch a stranger's
          # run while ours is still queued or later fails.
          CORR="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" \
            -f "ref=$BUILD_SHA" -f packages=all -f "correlation=$CORR"
          # The dispatch API returns no run id; poll for the run it created.
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 5
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml \
              --event workflow_dispatch --created ">=$MARK" --limit 50 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"[$CORR]\")) | .databaseId" \
              | head -n 1)
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::dispatched publish.yml run did not appear"; exit 1
          fi
          echo "Waiting on publish.yml run ${RUN_ID} (may pause for its release-environment approval)"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  crates-io:
    needs: [ build, coverage, integration, unit-tests ]
    # crates.io is immutable, so publish only after the suite is green (npm/tags
    # go out earlier, in `build`). Final releases only: pre-releases (version
    # contains a '-') skip the job - they ship via cargo [patch] + git tag.
    if: ${{ !contains(needs.build.outputs.version, '-') }}
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Publish crates to crates.io
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          nix develop .#ci -c .github/scripts/cargo-publish-crates.sh "$VERSION"

  release:
    # publish-npm is skipped on dry runs; `!cancelled() &&` (a status function,
    # so it bypasses the implicit success() check) keeps release eligible then,
    # while real runs still hard-require npm publication success. Not always():
    # that stays true during operator cancellation and would let this
    # irreversible job create/announce the release anyway.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.coverage.result == 'success' && needs.integration.result == 'success' && needs.unit-tests.result == 'success' && (needs.publish-npm.result == 'success' || (github.event.inputs.dry_run == 'true' && needs.publish-npm.result == 'skipped')) }}
    needs: [ build, coverage, integration, unit-tests, publish-npm ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.build.outputs.tag_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded-artifacts

      - name: Assemble release assets and checksums
        id: assets
        run: |
          set -euo pipefail
          STAGING="release-assets"
          mkdir -p "$STAGING"
          # nullglob so an absent optional artifact skips cleanly.
          shopt -s nullglob

          for f in downloaded-artifacts/npm-packages/*.tgz; do cp "$f" "$STAGING/"; done
          for f in downloaded-artifacts/unit-test-results/test-results.*; do cp "$f" "$STAGING/"; done
          for f in downloaded-artifacts/ledger-wasm-test-results-ctrf-ubuntu-latest/*; do cp "$f" "$STAGING/integration-ctrf-report.json"; done
          for f in downloaded-artifacts/ledger-wasm-test-results-junit-ubuntu-latest/*; do cp "$f" "$STAGING/integration-junit.xml"; done
          for f in downloaded-artifacts/integration-coverage-txt/*; do cp "$f" "$STAGING/integration-coverage.txt"; done

          if [ -d downloaded-artifacts/"Lcov Coverage Report" ]; then
            for f in downloaded-artifacts/"Lcov Coverage Report"/*; do cp "$f" "$STAGING/coverage.lcov"; done
          fi
          if [ -d downloaded-artifacts/"Coverage Report" ]; then
            ( cd downloaded-artifacts/"Coverage Report" && zip -qr "${GITHUB_WORKSPACE}/${STAGING}/coverage-html-report.zip" . )
          fi

          # Guard: `sha256sum *` would block on stdin if STAGING were empty.
          if [ -n "$(ls -A "$STAGING")" ]; then
            ( cd "$STAGING" && sha256sum -- * > SHA256SUMS )
          else
            echo "::warning::No release assets were assembled."
          fi
          echo "Assembled release assets:"
          ls -lah "$STAGING"
          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: warn

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.assets.outputs.staging }}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] would create/update release ${TAG_NAME} (title: Ledger ${VERSION}) with assets:"
            ls -1 "${STAGING}"
            exit 0
          fi
          NOTES_FILE="${GITHUB_WORKSPACE}/.github/release-notes/${TAG_NAME}.md"

          PRERELEASE_FLAG=""
          IS_PRERELEASE=false
          case "${VERSION}" in
            *-rc*|*-alpha*|*-beta*|*-performance*) PRERELEASE_FLAG="--prerelease"; IS_PRERELEASE=true ;;
          esac

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists - refreshing assets."
            gh release upload "${TAG_NAME}" "${STAGING}"/* --clobber
          elif [ "${IS_PRERELEASE}" = "true" ]; then
            # Pre-releases always use auto-generated notes.
            gh release create "${TAG_NAME}" --title "Ledger ${VERSION}" \
              --generate-notes --prerelease "${STAGING}"/*
          elif [ -f "${NOTES_FILE}" ]; then
            gh release create "${TAG_NAME}" --title "Ledger ${VERSION}" \
              --notes-file "${NOTES_FILE}" ${PRERELEASE_FLAG} "${STAGING}"/*
          else
            echo "::warning::No release notes at .github/release-notes/${TAG_NAME}.md - creating release with auto-generated notes. Add the file before release to use curated notes."
            gh release create "${TAG_NAME}" --title "Ledger ${VERSION}" \
              --generate-notes ${PRERELEASE_FLAG} "${STAGING}"/*
          fi

      - name: Announce release on Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_TOPIC_LEDGER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] would announce Ledger ${VERSION} on Slack (topic-ledger)."
            exit 0
          fi
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_TOPIC_LEDGER_WEBHOOK_URL not set - skipping Slack announcement."
            exit 0
          fi
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          KIND="release"
          case "${VERSION}" in
            *-rc*|*-alpha*|*-beta*|*-performance*) KIND="pre-release" ;;
          esac
          TEXT=":rocket: Ledger ${KIND} *${VERSION}* is out. <${RELEASE_URL}|Release notes & artifacts>"
          payload=$(jq -n --arg t "$TEXT" '{text: $t}')
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

  attach-proof-server-manifest:
    needs: [ build, release, docker-push ]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.build.outputs.tag_name }}
    steps:
      - name: Download signed proof-server build manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: proof-server-build-manifest-*
          path: ./proof-server-release-assets
          merge-multiple: true

      - name: Attach signed manifest to Ledger release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}" \
            ./proof-server-release-assets/build-manifest.json \
            ./proof-server-release-assets/build-manifest.json.asc \
            ./proof-server-release-assets/midnight-proof-server-public.asc \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
