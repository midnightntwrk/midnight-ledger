          jq -cR 'fromjson? | select( .type != "report" )' test-results.json | cargo2junit > ./test-results.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
