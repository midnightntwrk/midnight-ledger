name: Publish Ledger Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite existing GH Packages versions (delete-then-republish). Public npm cannot be overwritten and will error."
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build:
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  #v5.0.0

      - name: Setup GitHub Credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68 # v3.0.0
        with:
          machine: github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Setup API Credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68 # v3.0.0
        with:
          machine: api.github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cargo

      - name: Configure Cargo
        run: .github/scripts/configure-cargo.sh

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: '@midnightntwrk'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Cache Nix
        uses: input-output-hk/actions/attic@6d5d62ad59441a3c869a0e8abee4e1bf8b440c2f
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          endpoint: https://attic.ci.iog.io
          cache: midnight-public
          access_token: ${{ secrets.ATTIC_CACHE_TOKEN }}

      - name: Get project versions
        run: |
          for project in ledger-wasm ledger onchain-runtime-wasm onchain-runtime zkir zkir-wasm coin-structure base-crypto serialize storage transient-crypto; do
            cd "$project"
            VERSION=$( (grep '^version =' Cargo.toml || grep '^package.version =' ../Cargo.toml) | awk -F '"' '{print $2}')
            echo "$project version: $VERSION"
            VAR_NAME=$(echo "${project^^}_VERSION" | tr '-' '_')
            echo "$VAR_NAME=$VERSION" >> "$GITHUB_ENV"
            cd ..
            done

      - name: Add tags for upstream crates
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          projects=("coin-structure" "base-crypto" "serialize" "storage" "transient-crypto")
          for project in "${projects[@]}"; do
            VAR_NAME=$(echo "${project^^}_VERSION" | tr '-' '_')
            VERSION=${!VAR_NAME}
            TAG_NAME="${project}-${VERSION}"

            # Check if the long version tag exists on the remote
            if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
              echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for ${project}."
              continue
            fi

            # Create and push the new tag
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          done

      - name: Build and Publish Ledger
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          NPM_TOKEN: ${{ secrets.MIDNIGHTCI_NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          # Use wasm version, as this will include pre-release tags
          VERSION="${LEDGER_WASM_VERSION}"
          EPOCH_VERSION=$(grep '^name =' ledger/Cargo.toml | awk -F '"' '{print $2}' | grep -- -v | awk -F -v '{print $2}')
          TAG_NAME="ledger-${EPOCH_VERSION}.${VERSION}"

          if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for ledger."
          else
            cd ledger-wasm
            cargo check
            npm install
            npm run build:markdown-docs

            if git diff --quiet ../docs; then
              echo "No changes to the docs"
            else
              git add ../docs
              git commit -m "chore: update ledger-wasm docs"
              git push
            fi

            cd ..
            nix build .#ledger-wasm
            cd result/lib
            echo "Contents of result/lib:"
            ls -lah
            TGZ="midnight-ledger-v${EPOCH_VERSION}-${{ env.LEDGER_WASM_VERSION }}.tgz"
            PKG="@midnightntwrk/ledger-v${EPOCH_VERSION}"
            "${GITHUB_WORKSPACE}/.github/scripts/npm-publish-idempotent.sh" \
              "$TGZ" https://npm.pkg.github.com/midnightntwrk "$PKG" "${{ env.LEDGER_WASM_VERSION }}"
            # shellcheck disable=SC2016  # ${NPM_TOKEN} expanded by npm at .npmrc read time
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
            "${GITHUB_WORKSPACE}/.github/scripts/npm-publish-idempotent.sh" \
              "$TGZ" https://registry.npmjs.org/ "$PKG" "${{ env.LEDGER_WASM_VERSION }}"
            cd ../..

            # Create and push the new tag
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi


      - name: Build and Publish Onchain Runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          NPM_TOKEN: ${{ secrets.MIDNIGHTCI_NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          # Use wasm version, as this will include pre-release tags
          VERSION="${ONCHAIN_RUNTIME_WASM_VERSION}"
          SHORT_VERSION=$(echo "$VERSION" | awk -F. '{print $1}')
          TAG_NAME="onchain-runtime-${VERSION}"

          if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for onchain runtime."
          else
            cd onchain-runtime-wasm
            cargo check
            npm install
            npm run build:markdown-docs

            if git diff --quiet ../docs; then
              echo "No changes to the docs"
            else
              git add ../docs
              git commit -m "chore: update onchain-runtime-wasm docs"
              git push
            fi

            cd ..
            nix build .#onchain-runtime-wasm
            cd result/lib
            echo "Contents of result/lib:"
            ls -lah
            TGZ="midnight-onchain-runtime-v${SHORT_VERSION}-${{ env.ONCHAIN_RUNTIME_WASM_VERSION }}.tgz"
            PKG="@midnightntwrk/onchain-runtime-v${SHORT_VERSION}"
            "${GITHUB_WORKSPACE}/.github/scripts/npm-publish-idempotent.sh" \
              "$TGZ" https://npm.pkg.github.com/midnightntwrk "$PKG" "${{ env.ONCHAIN_RUNTIME_WASM_VERSION }}"
            # shellcheck disable=SC2016  # ${NPM_TOKEN} expanded by npm at .npmrc read time
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
            "${GITHUB_WORKSPACE}/.github/scripts/npm-publish-idempotent.sh" \
              "$TGZ" https://registry.npmjs.org/ "$PKG" "${{ env.ONCHAIN_RUNTIME_WASM_VERSION }}"
            cd ../..

            # Create and push the new tag
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi


      - name: Build and Publish ZKIR
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          NPM_TOKEN: ${{ secrets.MIDNIGHTCI_NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config --global user.name 'MidnightCI'
          git config --global user.email 'midnight-automation+midnightci@iohk.io'
          VERSION="${ZKIR_VERSION}"
          TAG_NAME="zkir-${VERSION}"
          SHORT_VERSION=$(echo "$VERSION" | awk -F. '{print $1}')

          if git ls-remote --tags origin | grep -qE "refs/tags/${TAG_NAME}(\^\{\})?$"; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping tagging for zkir."
          else
            cd zkir-wasm
            cargo check
            npm install
            npm run build:markdown-docs

            if git diff --quiet ../docs; then
              echo "No changes to the docs"
            else
              git add ../docs
              git commit -m "chore: update zkir-wasm docs"
              git push
            fi

            cd ..
            nix build .#zkir-wasm
            cd result/lib
            echo "Contents of result/lib:"
            ls -lah
            TGZ="midnight-zkir-v${SHORT_VERSION}-${{ env.ZKIR_WASM_VERSION }}.tgz"
            PKG="@midnightntwrk/zkir-v${SHORT_VERSION}"
            "${GITHUB_WORKSPACE}/.github/scripts/npm-publish-idempotent.sh" \
              "$TGZ" https://npm.pkg.github.com/midnightntwrk "$PKG" "${{ env.ZKIR_WASM_VERSION }}"
            # shellcheck disable=SC2016  # ${NPM_TOKEN} expanded by npm at .npmrc read time
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
            "${GITHUB_WORKSPACE}/.github/scripts/npm-publish-idempotent.sh" \
              "$TGZ" https://registry.npmjs.org/ "$PKG" "${{ env.ZKIR_WASM_VERSION }}"
            cd ../..

            # Create and push the new tag
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi


  docker-push:
    needs: build
    uses: ./.github/workflows/docker-push.yml
    secrets:
      MIDNIGHTBOT_PACKAGES_WRITE: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}
      ATTIC_CACHE_TOKEN: ${{ secrets.ATTIC_CACHE_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
