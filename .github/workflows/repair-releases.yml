name: Repair Ledger Releases (one-off)

# Disposable. Publishes proof-server releases cut before the release-workflow
# fixes landed, from the manifests their runs signed, and adds the multi-arch
# tags docker-push.yml only creates on ghcr.io. Nothing is rebuilt or re-signed.
# workflow_dispatch resolves the workflow by name only once some run has
# registered it, and this file is not on the default branch. The push trigger
# registers it with a run in which every job is skipped.
on:
  workflow_dispatch:
  push:
    branches: [ tkerber/repair-releases-oneoff ]

permissions:
  contents: write
  actions: read

jobs:
  # The fix in tkerber/release-ci-fixes publishes the signed manifest on a
  # proof-server-<version> release; this creates that release for a version
  # cut before the fix landed, from the manifest its run signed.
  proof-server-release:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 9.0.0-rc.8
            run_id: "36572687169"
    env:
      VERSION: ${{ matrix.version }}
      RUN_ID: ${{ matrix.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Download and verify signed manifest
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'proof-server-build-manifest-*' \
            --dir proof-server-release-assets
          MANIFEST=$(find proof-server-release-assets -type f -name build-manifest.json)
          SIGNATURE="${MANIFEST}.asc"

          SIGNED_VERSION=$(jq -r .version "$MANIFEST")
          if [ "$SIGNED_VERSION" != "$VERSION" ]; then
            echo "::error::run ${RUN_ID} signed ${SIGNED_VERSION}, not ${VERSION}"
            exit 1
          fi
          # The manifest must describe the image the tag serves now.
          IMAGE=$(jq -r .image "$MANIFEST")
          SIGNED_DIGEST=$(jq -r .image_digest "$MANIFEST")
          LIVE_DIGEST="sha256:$(docker buildx imagetools inspect "$IMAGE" --raw | sha256sum | cut -d' ' -f1)"
          if [ "$SIGNED_DIGEST" != "$LIVE_DIGEST" ]; then
            echo "::error::manifest signs ${SIGNED_DIGEST} but ${IMAGE} now resolves to ${LIVE_DIGEST}"
            exit 1
          fi

          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          gpg --batch --import proof-server/midnight-proof-server-public.asc
          gpg --batch --verify "$SIGNATURE" "$MANIFEST"

          cat "$MANIFEST"
          {
            echo "MANIFEST=$MANIFEST"
            echo "SIGNATURE=$SIGNATURE"
            echo "IMAGE_DIGEST=$SIGNED_DIGEST"
            echo "COMMIT=$(jq -r .git_commit "$MANIFEST")"
          } >> "$GITHUB_ENV"

      - name: Create proof-server GitHub release
        run: |
          set -euo pipefail
          TAG="proof-server-${VERSION}"
          PUBLIC_KEY="proof-server/midnight-proof-server-public.asc"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - refreshing manifest assets."
            gh release upload "$TAG" "$MANIFEST" "$SIGNATURE" "$PUBLIC_KEY" --clobber
            exit 0
          fi
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          NOTES=$(printf 'Image: `ghcr.io/midnight-ntwrk/proof-server:%s` (also `docker.io/midnightntwrk/proof-server:%s`)\nDigest: `%s`\n\nVerify the build manifest with the attached public key:\n\n```\ngpg --import midnight-proof-server-public.asc\ngpg --verify build-manifest.json.asc build-manifest.json\n```\n' \
            "$VERSION" "$VERSION" "$IMAGE_DIGEST")
          gh release create "$TAG" --target "$COMMIT" --title "Proof Server ${VERSION}" \
            --notes "$NOTES" $PRERELEASE_FLAG "$MANIFEST" "$SIGNATURE" "$PUBLIC_KEY"

  dockerhub-manifest:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        version: [ "9.0.0-rc.8" ]
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - name: Docker login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}

      - name: Create multi-arch tag on Docker Hub
        run: |
          set -euo pipefail
          HUB="docker.io/midnightntwrk/proof-server"
          GHCR="ghcr.io/midnight-ntwrk/proof-server"
          digest() { docker buildx imagetools inspect "$1" --raw | sha256sum | cut -d' ' -f1; }

          if docker buildx imagetools inspect "$HUB:$VERSION" >/dev/null 2>&1; then
            echo "$HUB:$VERSION already exists - skipping."
            exit 0
          fi
          docker manifest create "$HUB:$VERSION" "$HUB:$VERSION-amd64" "$HUB:$VERSION-arm64"
          docker manifest push "$HUB:$VERSION"

          # The per-arch images are byte-identical on both registries, so the
          # list digest should match the one the signed manifest records.
          HUB_DIGEST=$(digest "$HUB:$VERSION")
          GHCR_DIGEST=$(digest "$GHCR:$VERSION")
          if [ "$HUB_DIGEST" != "$GHCR_DIGEST" ]; then
            echo "::warning::$HUB:$VERSION digest $HUB_DIGEST differs from $GHCR:$VERSION digest $GHCR_DIGEST"
          fi
