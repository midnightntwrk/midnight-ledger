name: Ledger Build and Test All

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches:
      - 'ledger-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE : full

jobs:
  build-all:
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - name: Setup api.github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: api.github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Setup github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Configure git rewrite
        run: |
          mkdir -p $HOME/.config/git
          echo '[url "https://github.com/"]' >> $HOME/.config/git/config
          echo '  insteadOf = "git@github.com:"' >> $HOME/.config/git/config
          echo '  insteadOf = "git@github.com/"' >> $HOME/.config/git/config
          echo '  insteadOf = "ssh://git@github.com/"' >> $HOME/.config/git/config

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            # crates.io 403s any User-Agent starting with "curl/", which is what
            # nixpkgs' fetchurl sends. Flake-local overlays cannot reach nixpkgs
            # instantiated inside other flakes (the pinned zkir input), so override
            # the agent for every fixed-output builder here. curl rejects
            # --user-agent=X, and impure-env values cannot contain spaces, hence -A.
            # The feature list is spelled out in full: install-nix-action skips its
            # own "experimental-features = nix-command flakes" default whenever this
            # block merely contains that substring (install-nix.sh:60).
            experimental-features = nix-command flakes configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-Amidnight-ledger/1.0
            netrc-file = ${{ env.HOME }}/.netrc
            access-tokens = github.com=${{ secrets.GH_PASSWORD }} api.github.com=${{ secrets.GH_PASSWORD }}
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-primary-key: never
          purge-created: P7D

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build and Test
        run: |
          # Fail pipelines if any component fails, to avoid `tee` below hiding
          # failures in `nix develop` command.
          set -o pipefail
          nix develop -c cargo config -Z unstable-options get net.git-fetch-with-cli
          {
            test_status=0
            nix develop -c cargo test --workspace --all-features --exclude midnight-proof-server --release --no-fail-fast -- --nocapture --test-threads=1 || test_status=$?
            nix develop -c cargo test --package midnight-proof-server --features experimental --release --no-fail-fast -- --nocapture --test-threads=1 || test_status=$?
            exit "$test_status"
          } | tee test-output.log

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Test results
          path: test-output.log
