name: Publish npm packages

# Single npm-publish path for the ledger package family. Publishes each
# package to:
#   - GH Packages under BOTH scopes while the org migrates:
#       @midnight-ntwrk/<pkg>  (legacy scope)
#       @midnightntwrk/<pkg>   (migration target; on GH Packages this attaches
#                               to the midnightntwrk org instead of the
#                               deprecated midnight-ntwrk org)
#   - public npmjs under @midnightntwrk ONLY. The dashed @midnight-ntwrk scope
#     is retired on npmjs (shieldedtech/shielded-sre#761); existing dashed
#     versions stay installable and are deprecated with a pointer.
# The built tarball's own scope is never trusted: bagel.nix's default scope
# flipped on ledger-8 (f232211) and differs across release branches, so every
# tarball is normalized to each target scope before publishing.
# Publishes are idempotent per target: already-published versions are
# skipped, so re-runs after partial failures are safe.
#
# npm TRUSTED PUBLISHING: npmjs auth is OIDC - no npmjs token. THIS file
# (publish.yml) with environment `npm-publish-stable` must be registered as the trusted
# publisher (with "Allow npm publish") for every @midnightntwrk package:
#   @midnightntwrk/ledger-vN
#   @midnightntwrk/onchain-runtime-vN
# npm >= 11.5.1 performs the OIDC exchange automatically (guarded below) and
# attaches provenance. MIDNIGHTCI_PACKAGES_WRITE stays for GH Packages, which
# has no trusted publishing.
# Trusted publishing validates the TOP-LEVEL workflow file, so this workflow
# must stay directly dispatched - do not convert it to workflow_call.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and publish (branch, tag or SHA)."
        type: string
        required: true
      packages:
        description: "Which npm packages to publish."
        type: choice
        options:
          - all
          - ledger
          - onchain-runtime
        default: all
      dry_run:
        description: "Build and log every publish without publishing."
        type: boolean
        default: false
      correlation:
        description: "Opaque marker echoed into the run name so a dispatching workflow can find this exact run. Leave empty for manual runs."
        type: string
        default: ""

# The [correlation] suffix makes the dispatched run findable: prerelease.yml
# matches it exactly instead of guessing by creation time (which races with
# concurrent dispatches).
run-name: "Publish npm packages (${{ inputs.packages }} @ ${{ inputs.ref }})${{ inputs.correlation != '' && format(' [{0}]', inputs.correlation) || '' }}"

env:
  DRY_RUN: ${{ github.event.inputs.dry_run }}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # Standard hosted runner (free on public repos): the nix build is mostly
    # restored from the cache shared with prerelease.yml, so no large runner.
    runs-on: ubuntu-24.04
    # Real publishes require the protected `npm-publish-stable` environment, the
    # org-wide name for npm Trusted Publishing; dry runs need no approval.
    # NB: the truthy value must be the && arm - '' is falsy in GitHub
    # expressions, so `cond && '' || x` yields x on BOTH branches.
    environment: ${{ github.event.inputs.dry_run != 'true' && 'npm-publish-stable' || '' }}
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Checkout publish scripts (workflow ref)
        # The checkout above is the dispatched ref, which may be a historical
        # branch/tag that predates the helper scripts. The scripts must always
        # come from the workflow's own commit, so check them out separately.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          path: .publish-scripts

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          # Pinned so npm is >= 11.5.1 (OIDC trusted publishing); the runner's
          # default Node is not guaranteed to ship it.
          node-version: '24'
          registry-url: https://npm.pkg.github.com/
        env:
          # Dry runs never publish; give them no credentials at all.
          NODE_AUTH_TOKEN: ${{ github.event.inputs.dry_run != 'true' && secrets.MIDNIGHTCI_PACKAGES_WRITE || '' }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            # crates.io 403s any User-Agent starting with "curl/", which is what
            # nixpkgs' fetchurl sends. Flake-local overlays cannot reach nixpkgs
            # instantiated inside other flakes (the pinned zkir input), so override
            # the agent for every fixed-output builder here. curl rejects
            # --user-agent=X, and impure-env values cannot contain spaces, hence -A.
            # The feature list is spelled out in full: install-nix-action skips its
            # own "experimental-features = nix-command flakes" default whenever this
            # block merely contains that substring (install-nix.sh:60).
            experimental-features = nix-command flakes configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-Amidnight-ledger/1.0
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-primary-key: never
          purge-created: P7D

      - name: Build and publish
        env:
          # Dry runs never publish; give them no credentials at all.
          NODE_AUTH_TOKEN: ${{ github.event.inputs.dry_run != 'true' && secrets.MIDNIGHTCI_PACKAGES_WRITE || '' }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          GH_REG="https://npm.pkg.github.com/midnightntwrk"
          NPMJS_REG="https://registry.npmjs.org/"
          SCOPES="@midnight-ntwrk @midnightntwrk"
          SCRIPTS="${GITHUB_WORKSPACE}/.publish-scripts/.github/scripts"

          # npmjs auth is npm Trusted Publishing (OIDC): no token is written for
          # registry.npmjs.org, so npm exchanges the job's id-token. GH Packages
          # auth is configured by setup-node. Fail fast if npm can't do OIDC.
          NPM_VER=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VER" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_VER} < 11.5.1 - OIDC trusted publishing unsupported"; exit 1
          fi

          case "$PACKAGES" in
            all)             ATTRS="ledger-wasm onchain-runtime-wasm" ;;
            ledger)          ATTRS="ledger-wasm" ;;
            onchain-runtime) ATTRS="onchain-runtime-wasm" ;;
            *) echo "::error::unknown packages selection '$PACKAGES'"; exit 1 ;;
          esac

          STAGE="${GITHUB_WORKSPACE}/publish-artifacts"

          for ATTR in $ATTRS; do
            nix build ".#${ATTR}"

            # Copy the tarball out of the read-only nix store, then read the
            # canonical name/version from the tarball itself - the package
            # is the single source of truth, no duplicated derivation logic.
            ATTR_DIR="${STAGE}/${ATTR}"
            mkdir -p "$ATTR_DIR"
            cp result/lib/*.tgz "$ATTR_DIR/"
            TGZ_COUNT=$(find "$ATTR_DIR" -name '*.tgz' ! -name '*-rescoped.tgz' | wc -l)
            if [ "$TGZ_COUNT" -ne 1 ]; then
              echo "::error::expected exactly one npm tarball from nix build .#${ATTR}, found ${TGZ_COUNT}:"
              find "$ATTR_DIR" -name '*.tgz'; exit 1
            fi
            TGZ=$(find "$ATTR_DIR" -name '*.tgz' ! -name '*-rescoped.tgz')
            PKG=$(tar -xzOf "$TGZ" package/package.json | jq -r '.name')
            VER=$(tar -xzOf "$TGZ" package/package.json | jq -r '.version')
            BASE="${PKG##*/}"
            echo "::group::${PKG}@${VER} (${ATTR})"

            # Normalize to every target scope (rescoping to the tarball's own
            # scope is a harmless identity repack).
            for SCOPE in $SCOPES; do
              T=$("${SCRIPTS}/rescope-npm-tarball.sh" "$TGZ" "$SCOPE" "$ATTR_DIR")
              # npmjs gets the canonical @midnightntwrk scope only.
              REGS="$GH_REG"
              if [ "$SCOPE" = "@midnightntwrk" ]; then REGS="$GH_REG $NPMJS_REG"; fi
              for REG in $REGS; do
                "${SCRIPTS}/run-unless-dry.sh" \
                  "${SCRIPTS}/npm-publish-idempotent.sh" \
                  "$T" "$REG" "${SCOPE}/${BASE}" "$VER"
              done
            done
            echo "::endgroup::"
          done
