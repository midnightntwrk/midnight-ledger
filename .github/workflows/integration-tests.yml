name: Ledger Integration Tests

# Reusable: invoked by ci.yml and by the release flow (prerelease.yml).
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build
        run: nix build .#integration-test-deps

      - name: Add git bin to PATH for Yarn, verify git is installed
        run: |
          echo "/usr/bin" >> $GITHUB_PATH
          which git
          git --version

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Run integration tests
        run: |
          export MN_AXIOS=true
          set -o pipefail
          cd integration-tests
          yarn
          yarn lint
          yarn build
          yarn test:coverage:prepare
          nix develop .#ci -c yarn test:coverage | tee ./coverage.txt

      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: logs-ubuntu-latest
          path: integration-tests/logs/

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "ledger-wasm-test-results-ctrf-ubuntu-latest"
          path: "./integration-tests/reports/ctrf-report.json"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: "ledger-wasm-test-results-junit-ubuntu-latest"
          path: ./integration-tests/reports/test-report.xml

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-coverage-txt
          path: integration-tests/coverage.txt
