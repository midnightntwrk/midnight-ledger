name: Hard-Fork-Test Patcher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. `ledger-4.0.0`). A new tag with the same name prefixed with `hard-fork-test-` will be created.'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE : full

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup api.github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: api.github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Setup github.com credentials
        uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68
        with:
          machine: github.com
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}

      - name: Configure git rewrite
        run: |
          mkdir -p "$HOME/.config/git"
          {
            echo '[url "https://github.com/"]'
            echo '  insteadOf = "git@github.com:"'
            echo '  insteadOf = "git@github.com/"'
            echo '  insteadOf = "ssh://git@github.com/"'
          } >> "$HOME/.config/git/config"

      - name: Get the rust toolchain
        uses: dtolnay/rust-toolchain@38b70195107dddab2c7bbd522bcf763bac00963b
        with:
          components: rustfmt

      - name: Checkout workflow branch for patch tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Build the patch tool from workflow branch
        run: |
          cd ./scripts/hardfork_version_patch/
          cargo build --release
          mkdir -p "$HOME/tools"
          cp target/release/hardfork_version_patch "$HOME/tools/"

      - name: Checkout repository at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Patch the sources
        run: |
          "$HOME/tools/hardfork_version_patch" --tags standard-transaction
          sed -i -e 's/^version\(\s*\)=\(\s*\)"\(.*\)"$/version\1=\2"\3-hard-fork-test"/g' ./*/Cargo.toml
          # Remove version constraints from path dependencies so they work with patched prerelease versions
          sed -i -e '/path\s*=\s*"/ s/version\s*=\s*"[^"]*",\s*//' ./*/Cargo.toml

      - name: Update Cargo.lock
        run: |
          cargo generate-lockfile

      - name: Show changes
        run: |
          rm -rf .cargo
          git status

      - name: Sanitize branch name
        id: name-sanitizer
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `tag` is free text from workflow_dispatch. As a template expansion it was
          # pasted into this script *before* bash parsed it, so the fold below
          # sanitized nothing an attacker cared about; as an env var it is only ever
          # data. The allowlist additionally stops a newline forging extra step
          # outputs through $GITHUB_OUTPUT, and `required: true` does not exclude "".
          # (Do not name the template syntax in a run block - Actions evaluates it
          # here too, comment or not, and an empty one is a workflow syntax error.)
          tag="${TAG// /-}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::tag must be a release tag usable as a git ref, e.g." \
                 "'ledger-9.1.0.0-rc.5' - letters, digits, '.', '_' and '-' only," \
                 "at least one character (spaces are folded to '-'). Got: '$TAG'"
            exit 1
          fi
          sname="hard-fork-test-${tag}"
          # Let git itself rule on the residue the allowlist permits: '..', trailing
          # '.lock', a lone '@'. Cheaper than restating git's ref grammar here.
          if ! git check-ref-format "refs/tags/$sname"; then
            echo "::error::'$sname' is not a valid git ref name (see git-check-ref-format);" \
                 "avoid '..', a trailing '.lock', and a bare '@'. Derived from tag '$TAG'"
            exit 1
          fi
          echo "tag_name=$sname" >> "$GITHUB_OUTPUT"
          echo "Sanitized branch name: $sname"

      - name: Commit and push changes to a new branch and tag
        env:
          tag_name: ${{ steps.name-sanitizer.outputs.tag_name }}
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8
        with:
          message: 'hard-fork-test: original tag ${{ github.event.inputs.tag }}'
          new_branch: hard-fork-test/${{ env.tag_name }}
          tag: ${{ env.tag_name }}
