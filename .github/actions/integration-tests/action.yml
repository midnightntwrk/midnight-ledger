name: Ledger Integration Tests
description: >-
  Build the integration-test dependencies and run the integration-tests suite,
  uploading logs, JUnit/CTRF reports and the coverage summary. Reused (at step
  level) by ci.yml and by the release flow (prerelease.yml); the caller must
  check out the repository first.

runs:
  using: composite
  steps:
    - name: Configure git rewrite
      shell: bash
      run: |
        mkdir -p $HOME/.config/git
        echo '[url "https://github.com/"]' >> $HOME/.config/git/config
        echo '  insteadOf = "git@github.com:"' >> $HOME/.config/git/config
        echo '  insteadOf = "git@github.com/"' >> $HOME/.config/git/config
        echo '  insteadOf = "ssh://git@github.com/"' >> $HOME/.config/git/config

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
          accept-flake-config = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0

    - name: Configure cargo
      shell: bash
      run: .github/scripts/configure-cargo.sh

    - name: Cache dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

    - name: Build
      shell: bash
      run: nix build .#integration-test-deps

    - name: Add git bin to PATH for Yarn, verify git is installed
      shell: bash
      run: |
        echo "/usr/bin" >> $GITHUB_PATH
        which git
        git --version

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22

    - name: Run integration tests
      shell: bash
      run: |
        export MN_AXIOS=true
        set -o pipefail
        cd integration-tests
        yarn
        yarn lint
        yarn build
        yarn test:coverage:prepare
        nix develop .#ci -c yarn test:coverage | tee ./coverage.txt

    - name: Upload Logs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: logs-ubuntu-latest
        path: integration-tests/logs/

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: "ledger-wasm-test-results-ctrf-ubuntu-latest"
        path: "./integration-tests/reports/ctrf-report.json"

    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: "ledger-wasm-test-results-junit-ubuntu-latest"
        path: ./integration-tests/reports/test-report.xml

    - name: Upload coverage summary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: integration-coverage-txt
        path: integration-tests/coverage.txt
