name: Save reusable Nix outputs
description: Export realized project outputs without retaining build inputs or sources.
runs:
  using: composite
  steps:
    - name: Export reusable outputs
      if: env.NIX_CI_CACHE_KEY != '' && env.NIX_CI_CACHE_HIT != 'true'
      shell: bash
      run: python3 .github/scripts/export-nix-cache.py

    - name: Save Nix binary cache
      if: env.NIX_CI_CACHE_KEY != '' && env.NIX_CI_CACHE_HIT != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/nix-ci-cache
        key: ${{ env.NIX_CI_CACHE_KEY }}
