[package]
name = "midnight-prover-ffi"
version = "0.1.0"
# Pinned to 2021 originally because UniFFI 0.28 emitted bare
# `#[no_mangle]` (a hard error under 2024). Bumped to 2024
# now that UniFFI 0.31 wraps the macro in the required
# `#[unsafe(no_mangle)]` form. Match the rest of the
# mobile-bench workspace.
edition = "2024"
license = "Apache-2.0"
publish = false
description = "UniFFI Rust↔(Swift/Kotlin) bindings around the Midnight contract-benchmark prover. Consumed by the @midnight-ntwrk/react-native-prover npm package via uniffi-bindgen-react-native."

# We need BOTH a cdylib (for the .dylib / .so / .xcframework
# the platform layers link against) and a staticlib (for cases
# where we want a single self-contained archive — iOS App Store
# preference). `rlib` lets in-workspace consumers use the crate
# as a normal Rust dep too.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "midnight_prover_ffi"

[dependencies]
# Re-export the prove path from the existing mobile-bench crate.
# Same source as the dioxus-wallet uses, so the FFI here behaves
# identically to the wallet's local prover.
contract-benchmark = { path = "../../../mobile-bench/contract-benchmark" }

# Used by the optional wallet surface (gated on the `wallet`
# feature) to produce 32-byte seeds when the caller passes a
# null seed argument. Cheap dep; no harm leaving it unconditional
# since it's already in the workspace transitive tree.
rand = "0.8"
base-crypto = { path = "../../../base-crypto", package = "midnight-base-crypto" }

# Wallet store + secret storage + DID types. Adds substantial
# binary weight (~60 MB unstripped on aarch64) — wallet-core
# pulls in reqwest, tokio-tungstenite, graphql_client, redb,
# jubjub crypto, etc. — but the alternative (re-implementing
# keys/DID CRUD on the TS side) is far worse than the extra
# binary size for a real wallet app. If a downstream consumer
# only needs proving and wants to drop the wallet surface,
# they can disable the `wallet` cargo feature (added below)
# and the wallet-core dep falls out of the tree.
wallet-core = { path = "../../../mobile-bench/wallet-core", optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

# UniFFI scaffolding (proc-macro + runtime). Bumped to 0.31 to
# match `uniffi-bindgen-react-native` 0.31's expected runtime
# ABI. The bindgen tool encodes a UniFFI runtime version into
# its scaffolding output; mismatched versions = `extern fn`
# signature errors at link time.
uniffi = { version = "0.31", features = ["build", "tokio"] }

# Async runtime — uniffi's async support hands off blocking
# work to a tokio executor. `rt-multi-thread` so the prove
# call doesn't block the FFI poll loop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Logging shim — tracing is what the proofs crate uses; we
# bridge it to whatever the platform consumer wires up (Swift
# os.log / Android Logcat) via `tracing-subscriber` re-export.
tracing = "0.1"

# Error chain ergonomics — uniffi requires errors to be
# `#[derive(uniffi::Error)]`, and `thiserror` is the natural
# fit for the conversion-from-anyhow boilerplate.
thiserror = "1"

[features]
default = ["wallet"]
# Toggle the wallet-core dep + the keys/DID FFI surface.
# Consumers who only need the prover can disable this feature
# to keep the binary lean (saves ~60 MB on aarch64).
wallet = ["dep:wallet-core", "dep:serde_json", "dep:tempfile"]

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }
