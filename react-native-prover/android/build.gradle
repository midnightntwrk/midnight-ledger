// Gradle build for the Android side of @midnight-ntwrk/react-native-prover.
//
// Loaded by the host RN app via React Native autolinking. The
// host app's settings.gradle gets a synthetic `include ':react-
// native-prover'` entry; this file then drops the cross-compiled
// .so + the generated Kotlin Turbo Module sources into the build.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pin AGP to a version that matches the host RN's. RN 0.74
        // ships with AGP 8.3; consumers on older RNs need to override
        // via their `android/build.gradle`'s ext.AGP_version.
        classpath "com.android.tools.build:gradle:8.3.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.midnight.prover"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        // The disk-spill path needs the same RLIMIT_AS bump the
        // dioxus-wallet does. The wallet's `start_app()` already
        // handles this on its side; downstream RN hosts that
        // don't share that codepath should add the same
        // `libc::setrlimit` calls at process start (or inherit
        // the wallet's behaviour by linking us in).
    }

    sourceSets {
        main {
            // jniLibs/ holds the cross-compiled libmidnight_prover_ffi.so
            // dropped by scripts/build-android.sh.
            jniLibs.srcDirs += ['src/main/jniLibs']
            java.srcDirs += ['src/main/java']
        }
    }

    packagingOptions {
        // The Rust .so is the one we ship; don't accidentally pull
        // a duplicate from a transitive dependency.
        pickFirst "**/libmidnight_prover_ffi.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // React Native's Turbo Module framework. The actual JSI bridge
    // is generated by `ubrn build android`; this dep just makes
    // the host RN app's autolinking happy.
    implementation "com.facebook.react:react-android:+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    // JNA, which the UniFFI Kotlin bindings rely on for symbol
    // lookup into the cross-compiled .so.
    implementation "net.java.dev.jna:jna:5.14.0@aar"
}
