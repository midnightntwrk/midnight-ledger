[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
package.version = "8.1.0-rc.1"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-v3",
    "zkir-wasm",
    "zkir-v3-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core",
    "mobile-bench/prover-core",
    "mobile-bench/dioxus-bench",
    "mobile-bench/wallet-core",
    "mobile-bench/dioxus-wallet",
    "mobile-bench/headless-wallet",
    "mobile-bench/contract-benchmark",
    "mobile-bench/contract-benchmark-wasm",
    # UniFFI FFI crate consumed by the React Native bindings
    # in `react-native-prover/`. Lives outside `mobile-bench/`
    # because the wider directory is its own npm-publishable
    # subtree with platform-layer code (Swift/Kotlin/TS) not
    # part of the Rust workspace.
    "react-native-prover/crates/prover-ffi",
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"

# ---- Git fork of midnight-proofs (experimental) ----
#
# Points at the `feat/v0.7-h-poly-streaming` branch of
# https://github.com/yshyn-iohk/midnight-zk (a fork of
# github.com/midnightntwrk/midnight-zk). The branch carries four patches
# on top of the `midnight-proofs-v0.7.0` tag:
#
#   1. lazy g_lagrange via OnceLock + drop_lazy_bases
#   2. version bump to 0.7.99 (so [patch.crates-io] wins over 0.7.1)
#   3. read_custom_lazy<R: Read + Seek> (skip g_lagrange parse)
#   4. mmap-backed ParamsKZG via BasesStorage
#
# Patch (4) is the main event: `ParamsKZG::read_mmap_arc` constructs
# the prover params with `g`/`g_lagrange` as slice views into a
# memory-mapped companion file (`bls_midnight_2pN.mmap`). Zero
# heap allocation for the SRS; the OS pages handle eviction under
# memory pressure. Companions are built once via
# `bench_cli --build-mmap` (or `MIDNIGHT_MMAP_BUILD=1`) and shipped
# to the device.
#
# Empirical evaluation (M2 desktop, contract-benchmark k=4..14,
# `bench_cli --no-cache-keys`, 2026-05-22):
#
#   * Just the OnceLock wrapping is essentially free — RSS and
#     timings match the crates.io 0.7.1 baseline within run-to-run
#     jitter (≤15%).
#   * Calling `drop_lazy_bases` immediately after `read_custom` is
#     net-NEGATIVE at every observed k. At k=14 it 4-5x's keygen
#     (from ~500 ms to ~2.8 s) and 2x's prove. Reasons:
#       - `g_to_lagrange` is an inverse-NTT over 2^k group elements
#         (curve adds, not just field ops) — heavy at k≥12.
#       - `Vec::drop` keeps freed pages in the allocator pool, so
#         the FFT recompute doesn't shrink RSS; we just churn.
#
# Conclusion: the patch ships the *primitive* but no consumer
# inside this workspace exercises it usefully yet. It is the right
# building block for "release the Lagrange basis between idle
# proof sessions" (e.g. the wallet UI between user clicks), where
# the FFT recompute amortises against minutes of idle time. It is
# the wrong tool for tight in-loop calls.
#
# Pinned to v0.7.99 (a private hotfix-after-0.7.1 version) so the
# patch is selected over the published 0.7.1. SemVer constraints
# across the workspace (`^0.7.0`) accept both.
#
# Remove this block to fall back to `midnight-proofs = 0.7.1` and
# lose `drop_lazy_bases` (no other consumer currently calls it,
# so the only fallout is contract-benchmark losing the API hook).
[patch.crates-io]
midnight-proofs = { git = "https://github.com/yshyn-iohk/midnight-zk", branch = "feat/v0.7-h-poly-streaming" }
