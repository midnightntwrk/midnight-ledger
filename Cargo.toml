[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core"
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Because we pull in older, crates.io versions of `transient-crypto`, we need
# to force these to resolve locally for a local build. These patches not being
# present in consumer builds is fine, as they don't/shouldn't *want* the local
# packages.
[patch.crates-io]
midnight-base-crypto = { path = "base-crypto" }
midnight-serialize = { path = "serialize" }
midnight-transient-crypto = { path = "transient-crypto" }
# The zkir crates now live in their own repository. Once they are published
# to crates.io, these patches can be dropped.
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-zkir", tag = "zkir-3.0.0-rc.1" }
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-zkir", tag = "zkir-3.0.0-rc.1" }
midnight-zkir-wasm = { git = "https://github.com/midnightntwrk/midnight-zkir", tag = "zkir-3.0.0-rc.1" }
# Because we rely on additions in 2.2
midnight-transient-crypto-old = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1", package = "midnight-transient-crypto" }

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"
