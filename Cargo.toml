[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-v3",
    "zkir-wasm",
    "zkir-v3-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core",
    "v8-to-v9-state-translation",
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch",
    # Standalone Cargo project — has its own [patch.crates-io] for v8 git
    # tags that would otherwise feature-unify with the main workspace and
    # pull in conflicting sqlite linkers (sqlx-sqlite vs rusqlite).
    "v8-to-v9-state-translation-replay",
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"

# v9 release-candidate patches, per the release notes of its rc tags. The
# shared infrastructure (`base-crypto`, `serialize`, `storage-core`,
# `storage-macros`) resolves to the v9 tags for both v8 and v9; `storage`
# patches only v9's 3.x, so v8 keeps its crates.io 2.x.
# `midnight-transient-crypto-old` pins the v8-side transient-crypto 2.x to the
# rc tag because we rely on additions in 2.2.
[patch.crates-io]
midnight-base-crypto = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "base-crypto-1.1.1-rc.2" }
midnight-base-crypto-derive = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
midnight-ledger-v9 = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "crate-ledger-9.1.0.1-rc.2" }
midnight-ledger-static = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "crate-ledger-9.1.0.1-rc.2" }
midnight-zswap = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "zswap-9.0.1-rc.2" }
midnight-coin-structure = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "coin-structure-3.0.1-rc.1" }
midnight-transient-crypto = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "transient-crypto-3.0.1-rc.1" }
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-onchain-state = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "onchain-state-4.0.1-rc.1" }
midnight-onchain-vm = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "onchain-vm-4.0.1-rc.2" }
midnight-onchain-runtime = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "crate-onchain-runtime-4.0.1-rc.2" }
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.4" }
midnight-serialize = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "serialize-1.2.1-rc.1" }
midnight-storage = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "storage-3.0.0-rc.1" }
midnight-storage-core = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "storage-core-1.2.3-rc.2" }
midnight-storage-macros = { git = "ssh://git@github.com/shieldedtech/embargo-2026-10-midnight-ledger", tag = "storage-macros-1.0.1-rc.1" }
