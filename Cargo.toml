[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-v3",
    "zkir-wasm",
    "zkir-v3-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core",
    "v8-to-v9-state-translation",
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"

# Unify infrastructure crates whose APIs are tag-stable between ledger-8 and
# ledger-9. Without this, `v8-to-v9-state-translation` ends up with two copies
# of `midnight-storage` (etc.) in its dep graph — one from v8 transitively,
# one from v9 directly — and their traits do not overlap.
#
# Crates intentionally NOT patched: midnight-onchain-state, midnight-onchain-
# runtime, midnight-onchain-vm, midnight-zswap. Those have major-version bumps
# between v8 and v9 and need to coexist as distinct versions.
[patch.crates-io]
midnight-storage = { path = "storage" }
midnight-storage-core = { path = "storage-core" }
midnight-serialize = { path = "serialize" }
midnight-serialize-macros = { path = "serialize-macros" }
midnight-base-crypto = { path = "base-crypto" }
midnight-base-crypto-derive = { path = "base-crypto-derive" }
midnight-coin-structure = { path = "coin-structure" }
midnight-transient-crypto = { path = "transient-crypto" }
