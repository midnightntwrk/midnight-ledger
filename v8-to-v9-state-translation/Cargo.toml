[package]
name = "v8-to-v9-state-translation"
edition = "2024"
license.workspace = true
version = "0.1.0"

[dependencies]
# v8: released crates.io versions. `midnight-node`'s `toolkit-1.0.0` tag
# consumes the same final 8.1.0 (not rc.1), so the replay crate's helpers and
# the translation crate's v8 side share one Cargo instance from crates.io.
ledger-v8        = { version = "8.1.0", package = "midnight-ledger", features = ["proving"] }
onchain-state-v8 = { version = "3.0.0", package = "midnight-onchain-state" }

# v9: in-prerelease. Workspace `[patch.crates-io]` redirects these to the
# alpha git tags per the v9 release instructions.
ledger-v9        = { version = "0.1.0", package = "midnight-ledger-v9", features = ["proving", "test-utilities"] }
onchain-state-v9 = { version = "4.0.0", package = "midnight-onchain-state" }

# Shared infrastructure: same crates.io versions for both v8 and v9.
storage     = { version = "2.0.1", package = "midnight-storage", features = ["state-translation"] }
serialize   = { version = "1.1.0", package = "midnight-serialize" }
base-crypto = { version = "1.0.0", package = "midnight-base-crypto" }

[dev-dependencies]
coin-structure    = { version = "2.0.1", package = "midnight-coin-structure" }
transient-crypto  = { version = "2.1.0", package = "midnight-transient-crypto" }
rand              = { version = "^0.8.4", features = ["getrandom"] }
