[package]
name = "v8-to-v9-state-translation"
edition = "2024"
license.workspace = true
version = "0.1.0"

[dependencies]
# v8: released crates.io versions. `midnight-node`'s `toolkit-1.0.0` tag
# unifies to the same crates.io release, so the replay crate's helpers and
# the translation crate's v8 side share one Cargo instance.
ledger-v8        = { version = "8.1.3", package = "midnight-ledger", features = [] }
onchain-state-v8 = { version = "3.0.0", package = "midnight-onchain-state" }

# v9: released crates.io versions, from ledger 9.1.0.1 onwards.
ledger-v9        = { version = "1.0.1", package = "midnight-ledger-v9", features = [] }
onchain-state-v9 = { version = "4.0.1", package = "midnight-onchain-state" }

# v9 moved to a new `storage` major, so v8 and v9 tries and maps are distinct
# types; `storage-v9` also hosts the translation machinery. Both share
# `storage-core`, and so one arena; `storage` 2.0.5 is the first 2.x to build
# against the `storage-core` 1.2.3 that v9 requires.
storage     = { version = "2.0.5", package = "midnight-storage", features = ["public-internal-structure"] }
storage-v9  = { version = "3.0.0", package = "midnight-storage", features = ["state-translation"] }

# Shared infrastructure: same crates.io versions for both v8 and v9.
serialize   = { version = "1.2.1", package = "midnight-serialize" }
base-crypto = { version = "1.1.1", package = "midnight-base-crypto" }

[dev-dependencies]
# v8-side coin-structure (crates.io), used to build the v8 input state.
coin-structure    = { version = "2.0.1", package = "midnight-coin-structure" }
# v9-side coin-structure, used to key into the
# translated v9 state. v9 bumped coin-structure to a new major, so it is a
# distinct crate from the v8 one above.
coin-structure-v9 = { version = "3.0.1", package = "midnight-coin-structure" }
transient-crypto  = { version = "2.1.0", package = "midnight-transient-crypto" }
rand              = { version = "^0.8.4", features = ["getrandom"] }
