# quick-xml 0.26 is pulled in via pprof -> inferno 0.11 (dev/bench dependency only).
# inferno 0.12 dropped quick-xml, but pprof 0.15 (latest) pins inferno 0.11 and
# cargo [patch] can't cross semver boundaries for pre-1.0 crates.
# These are not exploitable in our context as they only affect benchmark flamegraph generation.
#
# crypto-bigint 0.5 is pulled in via elliptic-curve 0.13 (k256, p256 and primeorder 0.13).
# Our own crates are on k256 0.14 (crypto-bigint 0.7); midnight-curves 0.3 is the only
# remaining source, so it cannot be lifted here. The fix (crypto-bigint >= 0.7.6) needs
# midnight-curves to migrate to the elliptic-curve 0.14 crates upstream.
# TODO: drop once midnight-curves moves to elliptic-curve 0.14.
[advisories]
ignore = [
    "RUSTSEC-2026-0194", # quick-xml: quadratic duplicate attribute check
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation
    "RUSTSEC-2026-0387", # crypto-bigint 0.5: timing variability in constant-time ops
]
