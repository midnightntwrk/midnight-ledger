# Install: `pre-commit install` (the devshell does this automatically).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: dco-signoff
        name: DCO sign-off (use `git commit -s`; see CONTRIBUTING.md)
        language: pygrep
        entry: '^Signed-off-by: .+ <.+@.+>$'
        args: [--negate]
        stages: [commit-msg]
