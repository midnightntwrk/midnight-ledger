compressionLevel: mixed

# Yarn's default since 4.13. The 4.8 -> 4.18 migration wrote `true` here to
# preserve the old behaviour; nothing in this project needs it. Five packages
# ship install scripts (cpu-features, esbuild, protobufjs, ssh2, unrs-resolver)
# and all five were verified to load and run without them - esbuild transforms,
# eslint resolves, ssh2 falls back to its pure-JS crypto. If a future dependency
# genuinely needs one, allowlist that package via
# `dependenciesMeta.<pkg>.built: true` rather than reopening this globally.
enableScripts: false

enableGlobalCache: false

nodeLinker: node-modules

# Refuse any version published in the last 7 days. Compromised npm releases are
# usually yanked within hours, so a week of latency costs nothing and closes the
# window in which a hijacked maintainer account reaches CI. Needs yarn >= 4.10;
# on older yarn this key is a hard error, not an ignored one.
npmMinimalAgeGate: 7d

npmScopes:
  midnightntwrk:
    npmAlwaysAuth: true
    npmPublishRegistry: "https://npm.pkg.github.com/"
    npmRegistryServer: "https://npm.pkg.github.com/"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
